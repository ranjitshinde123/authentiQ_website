<!DOCTYPE html>
<html>
<head>
<style>
  body {
    background: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    padding: 30px;
  }
  .row {
    display: flex;
    gap: 30px;
  }
  .card-white {
    background: #ffffff;
    padding: 24px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
  }
  .card-black {
    background: #000000;
    padding: 24px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    color: white;
  }
</style>
</head>
<body>
  <h2>Master Reference vs Vectorized SVG</h2>
  
  <div class="row">
    <div class="card-white">
      <h4>Original User Upload (White)</h4>
      <img src="../public/images/authentiq_logo_light.jpg" width="220" />
    </div>

    <div class="card-white">
      <h4>New Vector SVG (White)</h4>
      <svg width="220" height="220" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- C-Ring -->
        <path d="M 52 71 L 52 82 A 34 34 0 1 1 83.4 61 L 71 61 A 23 23 0 1 0 52 71 Z" fill="#000000" />
        <!-- Checkmark (Tick) - Clear Gap, does NOT touch circle -->
        <path d="M 55 64 L 73 82 L 109 46 L 101.2 38.2 L 73 66.4 L 62.8 56.2 Z" fill="#000000" />
      </svg>
      <span style="font-family: sans-serif; font-size: 28px; font-weight: 700; color: #000000; letter-spacing: -0.5px;">authentiQ</span>
    </div>
  </div>

  <div class="row">
    <div class="card-black">
      <h4>Original User Upload (Black)</h4>
      <img src="../public/images/authentiq_logo_dark.jpg" width="220" />
    </div>

    <div class="card-black">
      <h4>New Vector SVG (Black/Metallic)</h4>
      <svg width="220" height="220" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="metalGradPreview" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="25%" stop-color="#e2e8f0" />
            <stop offset="50%" stop-color="#cbd5e1" />
            <stop offset="75%" stop-color="#94a3b8" />
            <stop offset="100%" stop-color="#e2e8f0" />
          </linearGradient>
          <linearGradient id="metalStrokePreview" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#64748b" />
            <stop offset="50%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#475569" />
          </linearGradient>
        </defs>
        <!-- C-Ring -->
        <path d="M 52 71 L 52 82 A 34 34 0 1 1 83.4 61 L 71 61 A 23 23 0 1 0 52 71 Z" fill="url(#metalGradPreview)" stroke="url(#metalStrokePreview)" stroke-width="0.8" />
        <!-- Checkmark (Tick) - Clear Gap, does NOT touch circle -->
        <path d="M 55 64 L 73 82 L 109 46 L 101.2 38.2 L 73 66.4 L 62.8 56.2 Z" fill="url(#metalGradPreview)" stroke="url(#metalStrokePreview)" stroke-width="0.8" />
      </svg>
      <span style="font-family: sans-serif; font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 35%, #94a3b8 65%, #f1f5f9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px;">authentiQ</span>
    </div>
  </div>
</body>
</html>
